[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "timeseries"
version = "0.2.0"
description = "Pattern matching and conditional forecasting at 1-minute or daily resolution"
# 3.10 is the floor because stumpy (the matrix profile, PLAN.md §C/§S) requires it.
# stumpy is a hard dependency, not an optional accelerator: it is the only scoring
# engine in the package, so a missing stumpy is an installation failure that must
# surface at import rather than become a slower, differently-ranked fallback.
requires-python = ">=3.10"

dependencies = [
    "numpy>=1.24.0",
    "pandas>=1.5.0",
    "stumpy>=1.13.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
# Data download and the Streamlit dashboard are not needed to run the package or its
# tests, so they stay out of the core dependency set.
app = [
    "yfinance>=0.2.36",
    # 1.56.0 is the floor because the Price tab's pannable chart needs `st.iframe`,
    # which took a URL in `st.components.v1.iframe` -- passing it a document silently
    # rendered an empty panel. See the call site in app.py.
    "streamlit>=1.56.0",
    "plotly>=5.18.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["ignore::RuntimeWarning"]
# Network tests are deselected by default so an offline or proxied machine cannot
# fail the suite for a reason that has nothing to do with the code.  Run them with
# ``pytest -m network``.  ``--strict-markers`` keeps the list honest: a typo in a
# marker name would otherwise silently become a no-op and quietly stop skipping.
addopts = "-m 'not network' --strict-markers"
markers = [
    "network: hits the live network; deselected by default, run with -m network",
]